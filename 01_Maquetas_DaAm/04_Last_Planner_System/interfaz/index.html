<script>
(()=>{
const root=document.getElementById('daam-review'),out=root.querySelector('#dr-content'),names=['Resumen LPS','Lookahead de seis semanas','Habilitantes y restricciones','Plan semanal','PCP y CNC'];let page=0;
const causes=['Entrega tardía de materiales','Falta de personal','Interferencia entre especialidades','Equipo no disponible','Retrabajo por calidad','Rendimiento inferior al previsto'];
const date=(w,offset=0)=>{const d=new Date(Date.UTC(2026,5,29+(w-1)*7+offset));return d.toISOString().slice(0,10)};const fmt=d=>d.split('-').reverse().join('/');
// Programa maestro: actividades únicas con duración y cantidades semanales.
const CONTROL_WEEK=15;
const program=[
['M01','Moldajes de losa','Piso 2',13,15,'m²',360,'Capataz obra gruesa'],
['M02','Armaduras de losa','Piso 2',14,15,'kg',4800,'Capataz obra gruesa'],
['M03','Hormigonado de losa','Piso 2',15,15,'m³',90,'Jefe de obra'],
['M04','Moldajes de pilares y muros','Piso 3',15,16,'m²',280,'Capataz obra gruesa'],
['M05','Armaduras de pilares y muros','Piso 3',15,16,'kg',3200,'Capataz obra gruesa'],
['M06','Hormigonado de pilares y muros','Piso 3',16,16,'m³',55,'Jefe de obra'],
['M07','Moldajes de losa','Piso 3',16,18,'m²',360,'Capataz obra gruesa'],
['M08','Armaduras de losa','Piso 3',17,18,'kg',4800,'Capataz obra gruesa'],
['M09','Hormigonado de losa','Piso 3',18,18,'m³',90,'Jefe de obra'],
['M10','Moldajes de pilares y muros','Piso 4',18,19,'m²',280,'Capataz obra gruesa'],
['M11','Armaduras de pilares y muros','Piso 4',18,19,'kg',3200,'Capataz obra gruesa'],
['M12','Hormigonado de pilares y muros','Piso 4',19,19,'m³',55,'Jefe de obra'],
['M13','Moldajes de losa de cubierta','Cubierta',19,21,'m²',360,'Capataz obra gruesa'],
['M14','Armaduras de losa de cubierta','Cubierta',20,21,'kg',4800,'Capataz obra gruesa'],
['M15','Hormigonado de losa de cubierta','Cubierta',21,21,'m³',90,'Jefe de obra'],
['M16','Tendido de tuberías sanitarias','Piso 1',14,17,'m',240,'Contratista sanitario'],
['M17','Canalizaciones eléctricas','Piso 1',15,18,'m',320,'Contratista eléctrico'],
['M18','Tendido de tuberías sanitarias','Piso 2',17,20,'m',240,'Contratista sanitario'],
['M19','Canalizaciones eléctricas','Piso 2',18,21,'m',320,'Contratista eléctrico'],
['M20','Montaje de tabiques','Piso 1',18,22,'m²',450,'Contratista terminaciones'],
['M21','Montaje de tabiques','Piso 2',20,24,'m²',450,'Contratista terminaciones']
].map((v,i)=>({id:v[0],name:v[1],sector:v[2],start:v[3],end:v[4],unit:v[5],total:v[6],responsible:v[7],index:i}));
const master=program.flatMap(x=>[0,1].map(j=>({...x,id:x.id+'-L0'+(j+1),masterId:x.id,name:x.name+' · '+(j===0?'primera mitad':'segunda mitad'),total:x.total/2,index:x.index*2+j})));
function gantt(week){const rows=program.filter(x=>x.start<=week+5&&x.end>=week);return '<div class="tablewrap"><table class="gantt-table"><thead><tr><th>ID maestro</th><th>Actividad</th><th>Ubicación</th>'+Array.from({length:6},(_,i)=>'<th class="'+(i===0?'gantt-current':'')+'">S'+(week+i)+'<br>'+fmt(date(week+i))+'<br>'+fmt(date(week+i,6))+'</th>').join('')+'</tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.id+'</td><td><button class="row-action" data-open-lookahead="'+x.id+'">'+x.name+'</button></td><td>'+x.sector+'</td>'+Array.from({length:6},(_,i)=>'<td class="'+(i===0?'gantt-current':'')+'">'+(x.start<=week+i&&x.end>=week+i?'<span class="gantt-on" aria-label="Programada"></span>':'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="footnote">Seleccione una actividad para consultar su desglose en el Lookahead. S'+week+' es la semana de control vigente.</p>'}
let selectedMaster=null,selectedLookahead=null;
function tasks(project,w){const active=master.filter(x=>x.start<=w&&x.end>=w);let records=active.flatMap((x,i)=>{const splits=w===15&&i<6?2:1;return Array.from({length:splits},(_,j)=>{const qty=+(x.total/(x.end-x.start+1)/splits).toFixed(1);return {...x,id:x.id+'-S'+w+'-C'+(j+1),lookaheadId:x.id,masterId:x.masterId,week:w,qty,restricted:x.index%4===0,restriction:x.index%4===0?'RES-'+x.id:null,committed:true,name:x.name+(splits>1?' · tramo '+(j+1):'')}})});return records.map((x,i)=>{const ok=w===15?i<7:(i+w)%5!==0;return {...x,ok,done:ok?x.qty:+(x.qty*.65).toFixed(1),reason:ok?'—':causes[(i-7+causes.length*4)%causes.length]}})}
function constraints(project,cut){return master.filter(x=>x.start<=cut+5&&x.end>=cut&&x.index%4===0).map(x=>({id:'RES-'+x.id,task:x.id,week:x.start,sector:x.sector,name:x.name,category:causes[x.index%4],description:'Confirmar entrega de material y liberación de la actividad',responsible:'Encargado de abastecimiento',due:date(x.start,-3),state:x.start<=cut?'Levantada':'Abierta',closed:x.start<=cut?date(x.start,-4):null}))}
const table=(head,rows)=>`<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}">Sin registros para estos filtros.</td></tr>`}</tbody></table></div>`,panel=(t,b)=>`<section class="panel"><h3>${t}</h3>${b}</section>`,metric=(l,v,h)=>`<div class="metric"><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h}</div></div>`;
function scope(){return {project:0,week:CONTROL_WEEK,matches:()=>true}}
function bars(a){const max=Math.max(1,...a.map(x=>x[1])),height=44*a.length+45;return '<div class="tablewrap"><svg viewBox="0 0 660 '+height+'" style="display:block;width:100%;max-width:720px;min-width:500px;margin:0 auto" role="img" aria-label="Causas de no cumplimiento: número de compromisos por causa">'+a.map(([label,n],i)=>'<text x="0" y="'+(29+i*44)+'" fill="#17375e" font-size="14">'+label+'</text><rect x="280" y="'+(12+i*44)+'" width="330" height="24" rx="3" fill="#eef2f7"/><rect x="280" y="'+(12+i*44)+'" width="'+(n/max*330)+'" height="24" rx="3" fill="#ff7900"/><text x="625" y="'+(29+i*44)+'" fill="#17375e" font-size="14" font-weight="bold">'+n+'</text>').join('')+'<text x="280" y="'+(height-8)+'" fill="#71839b" font-size="13">Número de compromisos no cumplidos</text></svg></div>'}
const historicalPCP=[65,70,60,75,80,70,75,85,80,75,90,80,80,85];
function history(project,week,matches){return Array.from({length:week},(_,i)=>{const w=i+1;if(w===15){const c=tasks(project,w),done=c.filter(x=>x.ok).length;return {week:w,total:c.length,done,ppc:done/c.length*100,cnc:causes.map(c=>c===null?0:c&&c.length?tasks(project,w).filter(x=>!x.ok&&x.reason===c).length:0)}}const total=20,done=historicalPCP[i]/5,cnc=Array(causes.length).fill(0);for(let j=0;j<total-done;j++)cnc[(j+w)%causes.length]++;return {week:w,total,done,ppc:done/total*100,cnc}})}
const cncColors=['#294b72','#ff7900','#bd4141','#8498b0','#547d9e','#bb8a54'];
function cncHistory(h){const rows=causes.map((label,i)=>({label,index:i,n:h.reduce((sum,x)=>sum+x.cnc[i],0)})).sort((a,b)=>b.n-a.n),max=Math.max(1,...rows.map(x=>x.n)),ceiling=Math.ceil(max/5)*5,base=230,left=45,width=650;let grid='';for(let v=0;v<=ceiling;v+=5){const y=base-v/ceiling*185;grid+='<line x1="45" x2="685" y1="'+y+'" y2="'+y+'" stroke="#e5ecf4"/><text x="36" y="'+(y+4)+'" text-anchor="end" font-size="13" fill="#71839b">'+v+'</text>'}const labels=[['Entrega tardía','de materiales'],['Falta de','personal'],['Interferencia entre','especialidades'],['Equipo no','disponible'],['Retrabajo','por calidad'],['Rendimiento','inferior al previsto']];return '<div class="tablewrap"><svg viewBox="0 0 710 320" style="display:block;width:100%;max-width:760px;min-width:580px;margin:0 auto" role="img" aria-label="CNC acumuladas por tipo desde S1 hasta S15, ordenadas de mayor a menor"><text x="45" y="20" font-size="13" fill="#71839b">Cantidad acumulada de CNC</text>'+grid+rows.map((x,i)=>{const cx=98+i*106,barHeight=x.n/ceiling*185;return '<rect x="'+(cx-30)+'" y="'+(base-barHeight)+'" width="60" height="'+barHeight+'" rx="3" fill="'+(i===0?'#ff7900':'#294b72')+'"><title>'+x.label+': '+x.n+'</title></rect><text x="'+cx+'" y="'+(base-barHeight-9)+'" text-anchor="middle" font-size="15" font-weight="bold" fill="#17375e">'+x.n+'</text>'+labels[x.index].map((line,j)=>'<text x="'+cx+'" y="'+(252+j*17)+'" text-anchor="middle" font-size="12" fill="#17375e">'+line+'</text>').join('')}).join('')+'</svg></div><p class="footnote">S1–S'+h.at(-1).week+' · Total acumulado: '+rows.reduce((sum,x)=>sum+x.n,0)+' CNC. Mayor frecuencia: '+rows[0].label+' ('+rows[0].n+').</p>'}
function curve(h){const width=490,left=42,right=470,bottom=165,top=30,den=Math.max(1,h.length-1);let grid='',ticks='';[0,25,50,75,100].forEach(v=>{const y=bottom-v*1.35;grid+=`<line x1="${left}" x2="${right}" y1="${y}" y2="${y}" stroke="#e5ecf4"/><text x="35" y="${y+4}" text-anchor="end">${v}%</text>`});grid+=`<line x1="${left}" x2="${right}" y1="${bottom-85*1.35}" y2="${bottom-85*1.35}" stroke="#bd4141" stroke-dasharray="4 4"/><text x="${left}" y="${bottom-85*1.35-6}">Umbral 85%</text>`;const points=h.map((x,i)=>`${left+i*(right-left)/den},${bottom-x.ppc*1.35}`).join(' ');h.forEach((x,i)=>ticks+=`<text x="${left+i*(right-left)/den}" y="187" text-anchor="middle">S${x.week}</text>`);return `<svg class="chart" viewBox="0 0 ${width} 205" role="img" aria-label="PCP semanal en porcentaje">${grid}${ticks}<polyline points="${points}" fill="none" stroke="#294b72" stroke-width="2.5"/>${h.map((x,i)=>`<circle cx="${left+i*(right-left)/den}" cy="${bottom-x.ppc*1.35}" r="4" fill="${x.ppc>=85?'#294b72':'#bd4141'}"/>`).join('')}</svg>`}
function render(){const {project,week,matches}=scope(),current=tasks(project,week).filter(matches),commits=current.filter(x=>x.committed),done=commits.filter(x=>x.ok).length,ppc=commits.length?Math.round(done/commits.length*100):null,restr=constraints(project,week).filter(matches),open=restr.filter(x=>x.state==='Abierta').length,h=history(project,week,matches),failed=commits.filter(x=>!x.ok);root.querySelector('#dr-title').textContent=names[page];root.querySelector('#master-info').innerHTML='<strong>Programa maestro: 55 semanas</strong> · Semana de control: S'+week+' · Horizonte: S'+week+'–S'+(week+5)+'<br>'+fmt(date(week))+' al '+fmt(date(week+5,6));const summary=`<div class="metrics">${metric('PCP · S'+(week-1),'<span style="color:'+(h[week-2].ppc>=85?'#294b72':'#bd4141')+'">'+h[week-2].ppc+' %</span>','Semana anterior')+metric('PCP · S'+week,'<span style="color:'+(ppc>=85?'#294b72':'#bd4141')+'">'+ppc+' %</span>','Corte vigente · Umbral 85 %')}${metric('Compromisos cumplidos',done+' / '+commits.length,'Meta completa alcanzada')}${metric('Restricciones abiertas',open,'Horizonte de seis semanas')}${metric('Actividades próximas',master.filter(x=>x.start<=week+5&&x.end>week).length,'Actividades del programa maestro')}</div>`;const causeRows=causes.map(c=>[c,failed.filter(x=>x.reason===c).length]);
const weekly=()=>table(['ID compromiso','ID Lookahead','ID maestro','Compromiso','Ubicación','Responsable','Meta','Ejecutado','Cumplimiento','Causa'],commits.map(x=>[x.id,x.lookaheadId,x.masterId,x.name,x.sector,x.responsible,x.qty+' '+x.unit,x.done+' '+x.unit,x.ok?'Cumplido':'No cumplido',x.reason]));
if(page===0)out.innerHTML=summary+panel('Gantt general · S'+week+'–S'+(week+5),gantt(week));
if(page===1){const ahead=master.filter(x=>x.start<=week+5&&x.end>=week&&(!selectedMaster||x.masterId===selectedMaster));out.innerHTML=(selectedMaster?'<button class="action" id="show-all">Ver todas las actividades</button>':'')+panel('Lookahead · Desglose de actividades del programa maestro',table(['ID Lookahead','ID maestro','Actividad','Ubicación','Fecha de inicio','Fecha de término','Responsable','Preparación','Requisito','Habilitantes'],ahead.map(x=>{const r=restr.find(r=>r.task===x.id),blocked=r&&r.state==='Abierta';return [x.id,x.masterId,x.name,x.sector,fmt(date(x.start)),fmt(date(x.end,4)),x.responsible,'<span class="lps-cell '+(blocked?'blocked':'ready')+'">'+(blocked?'Con restricción':'Lista')+'</span>',r?'<button class="row-action cursor-interaction" data-restriction="'+r.id+'">'+r.id+'</button>':'Sin requisitos pendientes','<button class="row-action" data-open-habilitantes="'+x.id+'">Ver habilitantes</button>']})))+'<div class="footnote">'+ahead.length+' actividades de la obra. Incluye actividades iniciadas antes del horizonte que continúan en estas seis semanas. El ID maestro vincula cada actividad con su origen en la Gantt. El ID Lookahead vincula su desglose con las habilitantes y los compromisos semanales.</div>'}
if(page===2){const activities=master.filter(x=>x.start<=week+5&&x.end>=week&&(!selectedLookahead||x.id===selectedLookahead));const habil=activities.flatMap(x=>{const r=restr.find(r=>r.task===x.id);return [[x.id,x.masterId,x.name,'Planos y procedimiento aprobados',x.responsible,fmt(date(x.start,-4)),'Habilitada','—'],[x.id,x.masterId,x.name,'Materiales disponibles',r?r.responsible:x.responsible,fmt(date(x.start,-3)),r&&r.state==='Abierta'?'Pendiente':'Habilitada',r?'<button class="row-action" data-restriction="'+r.id+'">'+r.id+'</button>':'—']]});out.innerHTML=(selectedLookahead?'<button class="action" id="all-habilitantes">Ver todas las habilitantes</button>':'')+panel('Habilitantes por actividad del Lookahead',table(['ID Lookahead','ID maestro','Actividad','Habilitante','Responsable','Fecha requerida','Estado','Restricción'],habil))+panel('Registro de restricciones',table(['ID','ID Lookahead','ID maestro','Actividad','Ubicación','Categoría','Restricción','Responsable','Fecha requerida','Estado','Detalle'],restr.filter(x=>!selectedLookahead||x.task===selectedLookahead).map(x=>[x.id,x.task,master.find(a=>a.id===x.task).masterId,x.name,x.sector,x.category,x.description,x.responsible,fmt(x.due),x.state,'<button class="row-action" data-restriction="'+x.id+'">Ver</button>'])))+'<div class="footnote">Una habilitante pendiente genera una restricción. Las actividades habilitadas pueden incorporarse al plan semanal.</div>'}
if(page===3)out.innerHTML=panel('Plan semanal · S'+week,weekly())+`<div class="alert">${done} compromisos cumplidos de ${commits.length}. Una ejecución parcial se considera no cumplida para el PCP.</div><div class="footnote">Semana del ${fmt(date(week))} al ${fmt(date(week,6))}. Control de demostración al viernes ${fmt(date(week,4))}. Todos los compromisos tienen resultado registrado.</div>`;
if(page===4)out.innerHTML=summary+panel('PCP · Evolución S1–S'+week,curve(h))+panel('CNC acumuladas por tipo · S1–S'+week,cncHistory(h))+panel('CNC · Causas de no cumplimiento · S'+week,bars(causeRows))+panel('Compromisos no cumplidos',table(['Actividad','Ubicación','Meta','Ejecutado','CNC'],failed.map(x=>[x.name,x.sector,x.qty+' '+x.unit,x.done+' '+x.unit,x.reason])))+'<div class="footnote">PCP = compromisos cumplidos / compromisos totales × 100. Una CNC por compromiso no cumplido. Datos históricos de demostración.</div>';
out.querySelectorAll('[data-open-lookahead]').forEach(b=>b.onclick=()=>{selectedMaster=b.dataset.openLookahead;page=1;root.querySelectorAll('nav button').forEach(x=>{x.classList.toggle('active',+x.dataset.page===1);x.setAttribute('aria-pressed',String(+x.dataset.page===1))});render()});const showAll=out.querySelector('#show-all');if(showAll)showAll.onclick=()=>{selectedMaster=null;render()};
out.querySelectorAll('[data-open-habilitantes]').forEach(b=>b.onclick=()=>{selectedLookahead=b.dataset.openHabilitantes;page=2;root.querySelectorAll('nav button').forEach(x=>{x.classList.toggle('active',+x.dataset.page===2);x.setAttribute('aria-pressed',String(+x.dataset.page===2))});render()});const allHabil=out.querySelector('#all-habilitantes');if(allHabil)allHabil.onclick=()=>{selectedLookahead=null;render()};
out.querySelectorAll('[data-restriction]').forEach(b=>b.onclick=()=>{const x=restr.find(x=>x.id===b.dataset.restriction);dialog.innerHTML=`<h3>${x.id}</h3><p>Actividad: ${x.name} · ${x.task}</p><p>${x.sector} · Semana ${x.week}</p><p>Restricción: ${x.description}</p><p>Responsable: ${x.responsible}</p><p>Fecha requerida: ${fmt(x.due)}</p><p>Estado: ${x.state}${x.closed?' · Levantada: '+fmt(x.closed):''}</p><button class="action cursor-interaction" id="lps-close">Cerrar</button>`;dialog.querySelector('#lps-close').onclick=()=>dialog.close();dialog.showModal()});
}
const dialog=document.createElement('dialog');root.appendChild(dialog);root.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;selectedMaster=null;selectedLookahead=null;root.querySelectorAll('nav button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});root.querySelectorAll('.filters select').forEach(s=>s.onchange=render);render();
})();
</script>
