review .panel{min-width:0;margin-bottom:14px}#daam-review .barrow{margin-bottom:18px}#daam-review .barlabel{display:flex;justify-content:space-between;font-size:12px;gap:10px;margin-bottom:5px}#daam-review .track{height:7px;background:#eef2f7;border-radius:8px;overflow:hidden}#daam-review .bar{height:100%;background:#ff7900;border-radius:8px}#daam-review .tablewrap{overflow:auto}#daam-review table{border-collapse:collapse;width:100%;font-size:12px}#daam-review th{text-align:left;color:#71839b;font-weight:700}#daam-review td,#daam-review th{padding:10px 6px;border-bottom:1px solid #e5ecf4;white-space:nowrap}#daam-review .alert{background:#fff2e5;padding:12px;border-radius:6px;font-size:12px;margin-bottom:14px}#daam-review footer{color:#71839b;font-size:11px;margin-top:18px}#daam-review .legend{font-size:11px;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}#daam-review .legend span:before{content:' ';display:inline-block;width:18px;height:3px;background:#ff7900;margin-right:6px;vertical-align:middle}#daam-review .legend span:last-child:before{background:#294b72}#daam-review .chart{width:100%;height:200px;display:block}#daam-review .chart text{font-family:Arial;font-size:11px;fill:#71839b}#daam-review .timeline{display:grid;gap:15px}#daam-review .timeline .track{height:18px}#daam-review .timeline .bar{background:#294b72}#daam-review .footnote{font-size:12px;color:#71839b;margin-top:10px}@media(max-width:750px){#daam-review{grid-template-columns:1fr;padding:10px}#daam-review aside{padding:4px 8px 14px}#daam-review .tag{margin-bottom:10px}#daam-review nav{display:flex;flex-wrap:wrap;gap:4px}#daam-review nav button{font-size:12px}#daam-review .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}#daam-review .panels{grid-template-columns:1fr}#daam-review .body{padding:15px}#daam-review .value{font-size:22px}}

<aside><div class="brand">DaAm</div><div class="tag">Construcción masiva</div><nav aria-label="Páginas principales"><button class="active cursor-interaction" data-page="0" aria-pressed="true">Resumen del proyecto</button><button class="cursor-interaction" data-page="1" aria-pressed="false">Mapa del proyecto</button><button class="cursor-interaction" data-page="2" aria-pressed="false">Detalle de unidad</button><button class="cursor-interaction" data-page="3" aria-pressed="false">Avance por partidas</button><button class="cursor-interaction" data-page="4" aria-pressed="false">Producción y alertas</button></nav></aside>
<main><header><span>PROYECTOS / CONSTRUCCIÓN MASIVA</span><span class="badge">Datos de demostración</span></header><div class="body"><h2 id="dr-title">Resumen del proyecto</h2><p class="sub">Control de construcción masiva · Vista para revisión</p><div class="filters"><label>Obra<select id="dr-project"><option>Conjunto de viviendas demo</option><option>Departamentos demo</option></select></label><label>Sector<select id="dr-sector"><option>Todos</option><option>Sector A</option><option>Sector B</option><option>Sector C</option></select></label><label>Semana de corte<select id="dr-week"><option value="8">Semana 08</option><option value="10">Semana 10</option><option value="12" selected>Semana 12</option><option value="14">Semana 14</option><option value="16">Semana 16</option></select></label></div><div id="dr-content" aria-live="polite"></div><footer>DaAm · Ingeniería y Asesorías | www.daam.cl · Información ficticia</footer></div></main>
<style>
#daam-review #mass-map{height:380px;border-radius:7px;z-index:0}#daam-review .local-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}#daam-review .local-controls label{min-width:145px}#daam-review .maplegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:10px 0}#daam-review .maplegend span{display:flex;align-items:center;gap:5px}#daam-review .dot{width:10px;height:10px;border-radius:50%;display:inline-block}#daam-review .unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}#daam-review .unit{background:#edf2f8;color:#17375e;text-align:center;min-height:44px;font-size:12px;border:1px solid #dfe7f1}#daam-review .unit.selected{background:#294b72;color:white}#daam-review .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#daam-review .detail-grid p{margin:0;font-size:13px}#daam-review .row-action{color:#17375e;text-decoration:underline;padding:2px 6px;min-height:32px;font-size:12px}#daam-review .action{background:#294b72;color:white;font-size:12px}#daam-review .leaflet-control-attribution a{color:#17375e}#daam-review .leaflet-control-zoom a{color:#17375e}#daam-review .map-note{font-size:12px;color:#71839b;margin-bottom:12px}@media(max-width:750px){#daam-review #mass-map{height:260px}#daam-review .detail-grid{grid-template-columns:1fr}#daam-review .unit-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
<script>
(()=>{
const root=document.getElementById('daam-review'),out=root.querySelector('#dr-content');const names=['Resumen del proyecto','Mapa del proyecto','Detalle de vivienda o departamento','Avance por partidas','Producción y alertas'];let page=0,selected=null,map=null,stage='Todas',type='Todas';
const colors={'Pendiente':'#8b9bb0','En ejecución':'#ff7900','Detenida':'#c04444','Terminada':'#294b72'};
const parts=[['Fundaciones',.2,'m³',24],['Estructura',.3,'m³',45],['Instalaciones',.2,'m',120],['Terminaciones',.3,'m²',80]];
const f=n=>n.toLocaleString('es-CL',{maximumFractionDigits:1});
const metric=(l,v,h)=>`<div class="metric"><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h}</div></div>`,panel=(t,b)=>`<section class="panel"><h3>${t}</h3>${b}</section>`,table=(head,rows)=>`<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}">Sin unidades para estos filtros.</td></tr>`}</tbody></table></div>`;
function build(project,week){const units=[];for(let j=0;j<3;j++)for(let i=0;i<12;i++){const begin=1+j*2+Math.floor(i/3),delay=(i%7===0?2:0)+(j===2?1:0),stop=i%7===0&&week>=begin+3&&week<begin+9;const progress=parts.map((p,k)=>{const planned=Math.max(0,Math.min(1,(week-begin-k*2+1)/3)),real=Math.max(0,Math.min(1,((stop?Math.min(week,begin+5):week)-begin-k*2+1-delay)/3));return {name:p[0],weight:p[1],unit:p[2],qty:p[3]*(project?0.8:1),p:planned,r:real}});const real=progress.reduce((a,x)=>a+x.r*x.weight,0)*100,planned=progress.reduce((a,x)=>a+x.p*x.weight,0)*100;const id=project?`T${j+1}-P${Math.floor(i/3)+1}-D${i%3+1}`:`V-${String(j*12+i+1).padStart(3,'0')}`;units.push({id,project,sector:'Sector '+String.fromCharCode(65+j),stage:'Etapa '+(i<6?1:2),type:project?(i%2?'3 dormitorios':'2 dormitorios'):(i%2?'Casa B':'Casa A'),tower:project?'Torre '+(j+1):null,floor:project?Math.floor(i/3)+1:null,begin,end:begin+8+delay,delay,progress,real,planned,state:real===100?'Terminada':real===0?'Pendiente':stop?'Detenida':'En ejecución',cause:stop?(i===0?'Material pendiente':'Liberación de frente'):'—',crew:'Cuadrilla '+(i%3+1),lat:-36.780244+(project?(1-j)*.0004:(2.5-Math.floor((j*12+i)/6))*.00015),lng:-73.0720812+(project?(j-1)*.00025:((j*12+i)%6-2.5)*.00019),index:i,group:j})}return units}
function current(w){const p=root.querySelector('#dr-project').selectedIndex,sector=root.querySelector('#dr-sector').value;return build(p,w??+root.querySelector('#dr-week').value).filter(x=>sector==='Todos'||x.sector===sector)}
const avg=(a,k)=>a.length?a.reduce((n,x)=>n+x[k],0)/a.length:0;
function bars(rows){return rows.map(([name,value])=>`<div class="barrow"><div class="barlabel"><span>${name}</span><strong>${f(value)} %</strong></div><div class="track"><div class="bar" style="width:${value}%"></div></div></div>`).join('')}
function legend(){return `<div class="maplegend">${Object.entries(colors).map(([k,v])=>`<span><i class="dot" style="background:${v}"></i>${k}</span>`).join('')}</div>`}
function nav(p,id){page=p;if(id)selected=id;root.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',+b.dataset.page===p);b.setAttribute('aria-pressed',String(+b.dataset.page===p))});render()}
function unitTable(units){return table(['Unidad','Sector','Tipología','Avance','Estado','Detalle'],units.map(x=>[x.id,x.sector,x.type,f(x.real)+' %',x.state,`<button class="row-action cursor-interaction" data-unit="${x.id}">Ver unidad</button>`]))}
const date=w=>{const d=new Date(Date.UTC(2026,6,13+(w-1)*7));return d.toLocaleDateString('es-CL',{timeZone:'UTC'})};
function render(){if(map){map.remove();map=null}const w=+root.querySelector('#dr-week').value,units=current(),project=root.querySelector('#dr-project').selectedIndex;root.querySelector('#dr-title').textContent=names[page];if(!units.find(x=>x.id===selected))selected=units[0]?.id;
const top=`<div class="metrics">${metric('Total de unidades',units.length,'Dentro de los filtros')}${metric('Avance global',f(avg(units,'real'))+' %','Planificado: '+f(avg(units,'planned'))+' %')}${metric('Terminadas',units.filter(x=>x.state==='Terminada').length,'Al corte de semana '+w)}${metric('Detenidas',units.filter(x=>x.state==='Detenida').length,'Con causa registrada')}</div>`;
if(page===0){out.innerHTML=top+`<div class="panels">${panel('Avance por sector',bars(['Sector A','Sector B','Sector C'].filter(s=>units.some(x=>x.sector===s)).map(s=>[s,avg(units.filter(x=>x.sector===s),'real')])))}${panel('Unidades por estado',legend()+table(['Estado','Unidades'],Object.keys(colors).map(s=>[s,units.filter(x=>x.state===s).length])))}</div>`+`<div class="alert">${units.filter(x=>x.real<x.planned).length} unidades bajo el avance planificado al corte.</div>`+panel('Seguimiento de unidades',unitTable(units))}
if(page===1){out.innerHTML=panel('Ubicación de unidades',`<div class="local-controls"><label>Etapa<select id="mass-stage"><option>Todas</option><option>Etapa 1</option><option>Etapa 2</option></select></label><label>Tipología<select id="mass-type"><option>Todas</option>${[...new Set(units.map(x=>x.type))].map(t=>`<option>${t}</option>`).join('')}</select></label></div><div class="map-note">Ubicaciones ficticias de demostración en el entorno del punto indicado en Talcahuano. Seleccione un punto para consultar sus unidades.</div><div id="mass-map" aria-label="Mapa georreferenciado de unidades"></div>${legend()}<div id="mass-selection"></div>`);root.querySelector('#mass-stage').value=stage;root.querySelector('#mass-type').value=type;if(root.querySelector('#mass-type').value!==type){type='Todas';root.querySelector('#mass-type').value=type}root.querySelector('#mass-stage').onchange=e=>{stage=e.target.value;drawMap()};root.querySelector('#mass-type').onchange=e=>{type=e.target.value;drawMap()};drawMap()}
if(page===2){const x=units.find(x=>x.id===selected);out.innerHTML=panel('Seleccione una unidad',`<label>Vivienda o departamento<select id="mass-unit">${units.map(u=>`<option value="${u.id}" ${u.id===selected?'selected':''}>${u.id} · ${u.sector}</option>`).join('')}</select></label>`)+panel(x.id+' · '+x.state,`<div class="detail-grid"><p>Sector: ${x.sector}</p><p>Tipología: ${x.type}</p><p>Etapa: ${x.stage}</p><p>Cuadrilla: ${x.crew}</p>${x.tower?`<p>${x.tower}</p><p>Piso: ${x.floor}</p>`:''}<p>Latitud: ${x.lat.toFixed(6)}</p><p>Longitud: ${x.lng.toFixed(6)}</p><p>Inicio planificado: ${date(x.begin)}</p><p>Término proyectado: ${date(x.end)}</p><p>Avance real: ${f(x.real)} %</p><p>Planificado: ${f(x.planned)} %</p></div>`)+panel('Historial por actividad',table(['Partida','Inicio previsto','Avance','Estado'],x.progress.map((p,i)=>[p.name,date(x.begin+i*2),f(p.r*100)+' %',p.r===1?'Terminada':p.r===0?'Pendiente':'En ejecución'])))+(x.state==='Detenida'?`<div class="alert">Causa de detención: ${x.cause}</div>`:'');root.querySelector('#mass-unit').onchange=e=>{selected=e.target.value;render()}}
if(page===3){const grouped=parts.map(([name])=>[name,avg(units.map(x=>({r:x.progress.find(p=>p.name===name).r*100})),'r')]);out.innerHTML=panel('Avance por partidas',bars(grouped))+panel('Cantidades por unidad',table(['Unidad','Sector','Partida','Unidad medida','Planificado','Ejecutado','Avance'],units.flatMap(x=>x.progress.map(p=>[x.id,x.sector,p.name,p.unit,f(p.qty*p.p),f(p.qty*p.r),f(p.r*100)+' %']))))+panel('Comparación de cuadrillas',table(['Cuadrilla','Unidades','Avance medio'],['Cuadrilla 1','Cuadrilla 2','Cuadrilla 3'].map(c=>{const a=units.filter(x=>x.crew===c);return [c,a.length,f(avg(a,'real'))+' %']})))+'<div class="footnote">Avance global: partidas ponderadas 20 % fundaciones, 30 % estructura, 20 % instalaciones y 30 % terminaciones; unidades con igual peso. Cantidades comparadas dentro de cada partida.</div>'}
if(page===4){const periods=Array.from({length:w},(_,i)=>{const now=current(i+1),before=i?current(i):now.map(x=>({...x,real:0}));return ['S'+(i+1),now.filter((x,j)=>x.real>0&&before[j].real===0).length,now.filter((x,j)=>x.real===100&&before[j].real<100).length,now.filter(x=>x.state==='Detenida').length]});const recent=periods.slice(-4),rate=recent.reduce((n,r)=>n+r[2],0)/recent.length;out.innerHTML=`<div class="metrics">${metric('Iniciadas acumuladas',units.filter(x=>x.real>0).length,'Al corte')}${metric('Terminadas acumuladas',units.filter(x=>x.real===100).length,'Al corte')}${metric('Ritmo de término',f(rate)+'/sem','Promedio últimas '+recent.length+' semanas')}${metric('Unidades con brecha',units.filter(x=>x.real<x.planned).length,'Avance menor al plan')}</div>`+panel('Producción semanal',table(['Semana','Iniciadas','Terminadas','Detenidas al corte'],periods))+panel('Unidades detenidas y causas',table(['Unidad','Sector','Causa','Cuadrilla'],units.filter(x=>x.state==='Detenida').map(x=>[x.id,x.sector,x.cause,x.crew])))+'<div class="footnote">Iniciadas y terminadas son cambios de estado durante la semana. Detenidas representa el saldo al corte; no se suma entre semanas.</div>'}
out.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>nav(2,b.dataset.unit));
}
function drawMap(){if(map){map.remove();map=null}const a=current().filter(x=>(stage==='Todas'||x.stage===stage)&&(type==='Todas'||x.type===type));const selection=root.querySelector('#mass-selection');selection.innerHTML=a.length?'':'Sin unidades para estos filtros.';if(!window.L){root.querySelector('#mass-map').innerHTML='El mapa no pudo cargar. Las unidades y sus coordenadas están disponibles en Detalle de unidad.';return}map=L.map(root.querySelector('#mass-map'),{scrollWheelZoom:false}).setView([-36.780244,-73.0720812],19);const tiles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics, GIS User Community'}).addTo(map);let failed=false;tiles.on('tileerror',()=>{if(!failed){failed=true;selection.insertAdjacentHTML('afterbegin','<p class="map-note">El fondo cartográfico no está disponible temporalmente; los puntos conservan sus coordenadas.</p>')}});const groups=new Map();a.forEach(x=>{const key=x.lat+','+x.lng;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)});const bounds=[];groups.forEach(g=>{const first=g[0],state=g.length===1?first.state:g.every(x=>x.state==='Terminada')?'Terminada':g.some(x=>x.state==='Detenida')?'Detenida':'En ejecución';const point=[first.lat,first.lng];bounds.push(point);const svg=g.length===1?`<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 11 L12 2 L22 11 L20 11 L20 22 L4 22 L4 11 Z" fill="${colors[state]}" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 22 V14 H14 V22" fill="white"/></svg>`:`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="1" fill="${colors[state]}" stroke="white" stroke-width="1.5"/><path d="M8 6 H10 M14 6 H16 M8 10 H10 M14 10 H16 M8 14 H10 M14 14 H16 M11 22 V18 H13 V22" fill="none" stroke="white" stroke-width="2"/></svg>`;const size=g.length===1?18:22;const icon=L.divIcon({className:'unit-map-icon',html:svg,iconSize:[size,size],iconAnchor:[size/2,size/2]});const marker=L.marker(point,{icon,title:g.length===1?first.id+' · '+state:first.tower+' · '+state}).addTo(map);marker.bindTooltip(g.length===1?first.id+' · '+first.state:(first.tower+' · '+g.length+' departamentos'));marker.on('click',()=>{selection.innerHTML=panel(g.length===1?first.id:first.tower,unitTable(g));selection.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>nav(2,b.dataset.unit))})});if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:19});}
root.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(+b.dataset.page));root.querySelectorAll('.filters select').forEach(s=>s.onchange=()=>{selected=null;stage='Todas';type='Todas';render()});render();
})();
</script>
</div><script>
(function(){
 function send(type,extra){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},extra||{}),'*');}
 function resize(){send('streamlit:setFrameHeight',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)});}
 window.addEventListener('message',function(e){if(e.source===window.parent&&e.data.type==='streamlit:render'){resize();}});
 send('streamlit:componentReady',{apiVersion:1});
 new ResizeObserver(resize).observe(document.body);
 window.addEventListener('load',resize);
})();
</script></body></html>
