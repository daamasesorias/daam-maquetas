<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DaAm · Inspección técnica y calidad</title><style>body{margin:0;padding:16px;background:#edf2f8}button,select{cursor:pointer}</style><meta name="description" content="Maqueta de revisión DaAm: inspección técnica y calidad con cinco páginas y datos de demostración."><link rel="icon" href="favicon.svg"><style>
@media(max-width:750px){
body{padding:6px}

#daam-review aside{padding:2px 6px 8px}
#daam-review .brand{font-size:24px;line-height:1.2}

#daam-review nav{gap:2px}
#daam-review nav button{padding:6px 8px;min-height:36px}

#daam-review .hint{line-height:1.3}
#daam-review .panel{padding:12px;margin-bottom:10px}
#daam-review .panels{gap:0;margin-bottom:0}
#daam-review .chart{height:auto;aspect-ratio:490/205}
#daam-review .legend{margin-bottom:4px}

#daam-review .alert{padding:9px;margin-bottom:10px}

#daam-review footer{margin-top:10px}
#daam-review .timeline{gap:10px}
}
</style><style>#daam-review .evidence-photo{display:block;width:100%;height:135px;object-fit:cover;border-radius:5px}#daam-review .evidence-photo.full{height:auto;max-height:320px;object-fit:contain}#daam-review .photo-note{font-size:11px;color:#71839b;margin:5px 0 10px}#daam-review dialog{max-height:90dvh;overflow-y:auto}</style></head><body>
<div id="daam-review">
<style>
#daam-review{font-family:Arial,sans-serif;color:#17375e;background:#0c294e;border-radius:12px;padding:16px;display:grid;grid-template-columns:175px minmax(0,1fr);font-size:14px;line-height:1.5}#daam-review *{box-sizing:border-box}#daam-review aside{color:white;padding:8px 12px 8px 0}#daam-review .brand{font-size:28px;font-weight:700;margin-bottom:0}#daam-review .tag{color:#a7bdd5;font-size:12px;margin-bottom:25px}#daam-review nav{display:grid;gap:8px}#daam-review button{font:inherit;border:0;text-align:left;background:transparent;color:inherit;padding:10px;border-radius:5px;min-height:44px}#daam-review button.active{background:#294b72;color:white}#daam-review main{background:#f4f7fb;border-radius:9px;overflow:hidden;min-width:0}#daam-review header{background:white;padding:15px 22px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#daam-review .badge{color:#ac5200}#daam-review .body{padding:22px}#daam-review h2{font-size:23px;margin:0 0 4px;font-weight:700}#daam-review h3{font-size:16px;margin:0 0 14px;font-weight:700}#daam-review .sub{color:#71839b;margin:0 0 18px}#daam-review .filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}#daam-review label{display:grid;gap:4px;font-size:12px;flex:1;min-width:130px}#daam-review select{font:inherit;background:white;border:1px solid #dfe7f1;color:#17375e;padding:9px;border-radius:7px;width:100%;min-height:44px}#daam-review .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}#daam-review .metric,#daam-review .panel{background:white;border:1px solid #dfe7f1;border-radius:8px;padding:15px}#daam-review .metric .label{font-size:11px;color:#71839b;font-weight:700;text-transform:uppercase}#daam-review .value{font-size:25px;font-weight:700;margin:3px 0}#daam-review .hint{font-size:11px;color:#71839b}#daam-review .orange{color:#ed7000}#daam-review .panels{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}#daam-review .panel{min-width:0;margin-bottom:14px}#daam-review .barrow{margin-bottom:18px}#daam-review .barlabel{display:flex;justify-content:space-between;font-size:12px;gap:10px;margin-bottom:5px}#daam-review .track{height:7px;background:#eef2f7;border-radius:8px;overflow:hidden}#daam-review .bar{height:100%;background:#ff7900;border-radius:8px}#daam-review .tablewrap{overflow:auto}#daam-review table{border-collapse:collapse;width:100%;font-size:12px}#daam-review th{text-align:left;color:#71839b;font-weight:700}#daam-review td,#daam-review th{padding:10px 6px;border-bottom:1px solid #e5ecf4;white-space:nowrap}#daam-review .alert{background:#fff2e5;padding:12px;border-radius:6px;font-size:12px;margin-bottom:14px}#daam-review footer{color:#71839b;font-size:11px;margin-top:18px}#daam-review .legend{font-size:11px;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}#daam-review .legend span:before{content:' ';display:inline-block;width:18px;height:3px;background:#ff7900;margin-right:6px;vertical-align:middle}#daam-review .legend span:last-child:before{background:#294b72}#daam-review .chart{width:100%;height:200px;display:block}#daam-review .chart text{font-family:Arial;font-size:11px;fill:#71839b}#daam-review .timeline{display:grid;gap:15px}#daam-review .timeline .track{height:18px}#daam-review .timeline .bar{background:#294b72}#daam-review .footnote{font-size:12px;color:#71839b;margin-top:10px}@media(max-width:750px){#daam-review{grid-template-columns:1fr;padding:10px}#daam-review aside{padding:4px 8px 14px}#daam-review .tag{margin-bottom:10px}#daam-review nav{display:flex;flex-wrap:wrap;gap:4px}#daam-review nav button{font-size:12px}#daam-review .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}#daam-review .panels{grid-template-columns:1fr}#daam-review .body{padding:15px}#daam-review .value{font-size:22px}}
</style>
<aside><div class="brand">DaAm</div><div class="tag">Inspección y calidad</div><nav aria-label="Páginas principales"><button class="active cursor-interaction" data-page="0" aria-pressed="true">Resumen de calidad</button><button class="cursor-interaction" data-page="1" aria-pressed="false">Inspecciones</button><button class="cursor-interaction" data-page="2" aria-pressed="false">Observaciones y hallazgos</button><button class="cursor-interaction" data-page="3" aria-pressed="false">Evidencias</button><button class="cursor-interaction" data-page="4" aria-pressed="false">Acciones correctivas y cierre</button></nav></aside>
<main><header><span>PROYECTOS / INSPECCIÓN Y CALIDAD</span><span class="badge">Datos de demostración</span></header><div class="body"><h2 id="dr-title">Resumen de calidad</h2><p class="sub">Inspección técnica y calidad · Vista para revisión</p><div class="filters"><label>Obra<select id="dr-project"><option>Edificio demostrativo</option><option>Centro logístico demostrativo</option></select></label><label>Sector<select id="dr-sector"><option>Todos</option><option>Sector A</option><option>Sector B</option><option>Sector C</option></select></label><label>Período<select id="dr-week"><option value="all">Todo el período</option><option value="39">Semana 39</option><option value="40" selected>Semana 40</option><option value="41">Semana 41</option></select></label></div><div id="dr-content" aria-live="polite"></div><footer>DaAm · Ingeniería y Asesorías | www.daam.cl · Información ficticia</footer></div></main>
<style>
#daam-review .quality-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#daam-review .evidence{padding:12px;background:#f4f7fb;border-radius:6px;border:1px solid #dfe7f1}
#daam-review .evidence strong{display:block;margin-bottom:5px}
#daam-review .evidence p{font-size:12px;margin:5px 0}
#daam-review .action{background:#294b72;color:white;font-size:12px;margin-top:8px}
#daam-review dialog{border:1px solid #dfe7f1;border-radius:10px;color:#17375e;max-width:560px;width:calc(100% - 32px);padding:20px}
#daam-review dialog::backdrop{background:#0c294e99}
#daam-review .checklist{padding-left:20px;font-size:14px}
#daam-review .row-action{color:#17375e;text-decoration:underline;padding:2px 6px;min-height:32px;font-size:12px}
@media(max-width:750px){#daam-review .quality-grid{grid-template-columns:1fr}#daam-review .evidence p{margin:3px 0}}
</style>
<script>
(()=>{
const root=document.getElementById('daam-review'),out=root.querySelector('#dr-content');
const names=['Resumen de calidad','Inspecciones','Observaciones y hallazgos','Evidencias','Acciones correctivas y cierre'];let page=0;
const templates=[
['Fundaciones','Obra gruesa','Dimensiones y recubrimientos','Conforme',null],
['Estructura','Obra gruesa','Armaduras y limpieza de moldajes','Con observaciones','Recubrimiento insuficiente en armadura'],
['Instalaciones sanitarias','Instalaciones','Prueba de estanqueidad','Con observaciones','Pérdida de presión en tramo de prueba'],
['Tabiquería','Terminaciones','Alineación y fijaciones','Conforme',null],
['Impermeabilización','Terminaciones','Continuidad y sellos','Con observaciones','Sello discontinuo en encuentro'],
['Instalaciones eléctricas','Instalaciones','Continuidad y rotulación','Pendiente',null]
];
const inspections=[],findings=[];let id=1,h=1;
for(let project=0;project<2;project++)for(let sector=0;sector<3;sector++)for(let i=0;i<6;i++){
const t=templates[i],week=39+(i%3),day=21+(week-39)*7+sector;
const date=new Date(Date.UTC(2026,8,day));const insp={id:'INS-'+String(id++).padStart(3,'0'),project,sector:'Sector '+String.fromCharCode(65+sector),week,date:date.toISOString().slice(0,10),part:t[0],specialty:t[1],check:t[2],result:t[3],responsible:['ITO obra gruesa','ITO instalaciones','ITO terminaciones'][i%3],finding:null};
if(t[4]){const n=h++,closed=(n%3===0),state=closed?'Cerrada':n%2===0?'En corrección':'Abierta';const detected=new Date(date),due=new Date(date);due.setUTCDate(due.getUTCDate()+4);const close=new Date(due);close.setUTCDate(close.getUTCDate()-1);const f={id:'OBS-'+String(n).padStart(3,'0'),inspection:insp.id,project,sector:insp.sector,week,date:insp.date,description:t[4],classification:'No conformidad',priority:i===2?'Alta':'Media',responsible:i===2?'Contratista sanitario':i===1?'Jefe de obra':'Contratista terminaciones',due:due.toISOString().slice(0,10),state,action:i===2?'Reparar unión y repetir prueba de presión':i===1?'Ajustar separadores y verificar recubrimiento':'Reponer sello y verificar continuidad',close:closed?close.toISOString().slice(0,10):null};insp.finding=f.id;findings.push(f)}inspections.push(insp)
}
const photo=x=>x.description.includes('Recubrimiento')?'armadura':x.description.includes('presión')?'presion':'sello';
const photoHtml=(x,full=false)=>`<img class="evidence-photo ${full?'full':''}" src="evidencias/${photo(x)}.png" alt="Fotografía ilustrativa: ${x.description}" loading="lazy"><p class="photo-note">Fotografía de demostración generada con IA</p>`;
const cutoff='2026-10-07',fmt=d=>d?d.split('-').reverse().join('/'):'—',metric=(l,v,h)=>`<div class="metric"><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h}</div></div>`,panel=(t,b)=>`<section class="panel"><h3>${t}</h3>${b}</section>`,table=(head,rows)=>`<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}">Sin registros para estos filtros.</td></tr>`}</tbody></table></div>`;
function select(){const p=root.querySelector('#dr-project').selectedIndex,s=root.querySelector('#dr-sector').value,w=root.querySelector('#dr-week').value;const matches=x=>x.project===p&&(s==='Todos'||x.sector===s)&&(w==='all'||x.week===+w);return {ins:inspections.filter(matches),obs:findings.filter(matches)}}
function bars(items,total){return items.map(([l,n])=>`<div class="barrow"><div class="barlabel"><span>${l}</span><strong>${n}</strong></div><div class="track"><div class="bar" style="width:${total?n/total*100:0}%"></div></div></div>`).join('')}
function render(){const {ins,obs}=select(),done=ins.filter(x=>x.result!=='Pendiente').length,closed=obs.filter(x=>x.state==='Cerrada').length,open=obs.length-closed,late=obs.filter(x=>x.state!=='Cerrada'&&x.due<cutoff).length;root.querySelector('#dr-title').textContent=names[page];
const obsRows=obs.map(x=>[x.id,x.description,x.sector,x.priority,x.state,fmt(x.due),`<button class="row-action cursor-interaction" data-detail="${x.id}">Ver detalle</button>`]);
if(page===0)out.innerHTML=`<div class="metrics">${metric('Inspecciones realizadas',done,ins.length-done+' pendientes')}${metric('Observaciones abiertas',open,'Incluye en corrección')}${metric('Observaciones cerradas',closed,'Cierre verificado')}${metric('Vencidas',late,'Corte: 07/10/2026')}</div><div class="panels">${panel('Resultado de inspecciones',bars(['Conforme','Con observaciones','Pendiente'].map(s=>[s,ins.filter(x=>x.result===s).length]),ins.length))}${panel('Estado de observaciones',bars(['Abierta','En corrección','Cerrada'].map(s=>[s,obs.filter(x=>x.state===s).length]),obs.length))}</div><div class="alert">${late} observaciones abiertas con fecha comprometida vencida.</div>`+panel('Observaciones del período',table(['ID','Hallazgo','Sector','Prioridad','Estado','Compromiso','Detalle'],obsRows));
if(page===1)out.innerHTML=panel('Registro de inspecciones',table(['ID','Fecha','Especialidad','Sector','Partida','Responsable','Resultado','Lista aplicada'],ins.map(x=>[x.id,fmt(x.date),x.specialty,x.sector,x.part,x.responsible,x.result,`<button class="row-action cursor-interaction" data-detail="${x.id}">Ver lista</button>`])))+`<div class="footnote">Inspecciones pendientes: lista asignada, aún sin resultado.</div>`;
if(page===2)out.innerHTML=panel('Observaciones y hallazgos',table(['ID','Hallazgo','Sector','Prioridad','Estado','Compromiso','Detalle'],obsRows));
if(page===3)out.innerHTML=panel('Evidencias asociadas',`<div class="quality-grid">${obs.map(x=>`<article class="evidence">${photoHtml(x)}<strong>EV-${x.id.slice(4)} · ${x.sector}</strong><p>${x.description}</p><p>Inspección: ${x.inspection} · Hallazgo: ${x.id}</p><p>Fecha: ${fmt(x.date)}</p><p>Fotografía y acta de inspección de muestra</p><button class="action cursor-interaction" data-detail="${x.id}">Abrir evidencia</button></article>`).join('')}</div>`)+`<div class="footnote">Fotografías ilustrativas y registros ficticios vinculados a cada hallazgo. Las imágenes se reutilizan por tipo de observación y no corresponden a obras reales.</div>`;
if(page===4){const rate=obs.length?Math.round(closed/obs.length*100):0;const days=obs.filter(x=>x.close).map(x=>(Date.parse(x.close)-Date.parse(x.date))/86400000),avg=days.length?(days.reduce((a,b)=>a+b,0)/days.length).toFixed(1):'—';out.innerHTML=`<div class="metrics">${metric('Acciones pendientes',open,'Abiertas y en corrección')}${metric('Cierres verificados',closed,'Con registro de verificación')}${metric('Resolución',rate+' %','Cerradas / observaciones del período')}${metric('Tiempo medio de cierre',avg==='—'?'—':avg+' días','Solo observaciones cerradas')}</div>`+panel('Acciones correctivas y verificación',table(['Hallazgo','Acción requerida','Responsable','Compromiso','Estado','Cierre','Verificación'],obs.map(x=>[x.id,x.action,x.responsible,fmt(x.due),x.state,fmt(x.close),x.close?`<button class="row-action cursor-interaction" data-detail="${x.id}">Ver cierre</button>`:'Pendiente'])))+`<div class="footnote">Indicadores por fecha de detección del hallazgo. Vencimiento evaluado al 07/10/2026.</div>`}
out.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>detail(b.dataset.detail)));
}
const dialog=document.createElement('dialog');dialog.id='quality-dialog';root.appendChild(dialog);
function detail(id){let x=inspections.find(x=>x.id===id);if(x){dialog.innerHTML=`<h3>${x.id} · ${x.part}</h3><p>${fmt(x.date)} · ${x.sector} · ${x.responsible}</p><p>Lista aplicada: ${x.check}</p><ul class="checklist"><li>Documentación y planos vigentes: ${x.result==='Pendiente'?'Por revisar':'Verificados'}</li><li>Ubicación y alcance: ${x.result==='Pendiente'?'Por revisar':'Verificados'}</li><li>Control de ejecución: ${x.result}</li></ul><p>Hallazgo asociado: ${x.finding||'Sin observaciones'}</p>`}else{x=findings.find(x=>x.id===id);dialog.innerHTML=`<h3>${x.id} · ${x.description}</h3>${photoHtml(x,true)}<p>Inspección ${x.inspection} · ${x.sector} · ${fmt(x.date)}</p><p>Clasificación: ${x.classification} · Prioridad: ${x.priority}</p><p>Responsable: ${x.responsible}</p><p>Acción: ${x.action}</p><p>Compromiso: ${fmt(x.due)} · Estado: ${x.state}</p><p>Evidencia de detección: acta EV-${x.id.slice(4)} de muestra.</p><p>${x.close?'Cierre verificado por ITO el '+fmt(x.close)+'. Acción revisada y resultado conforme.':'Verificación de cierre pendiente.'}</p>`}dialog.innerHTML+='<button class="action cursor-interaction" id="quality-close">Cerrar</button>';dialog.querySelector('#quality-close').onclick=()=>dialog.close();dialog.showModal()}
root.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{page=+b.dataset.page;root.querySelectorAll('nav button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()}));root.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));render();
})();
</script>
</div><script>
(function(){
 function send(type,extra){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},extra||{}),'*');}
 function resize(){send('streamlit:setFrameHeight',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)});}
 window.addEventListener('message',function(e){if(e.source===window.parent&&e.data.type==='streamlit:render'){resize();}});
 send('streamlit:componentReady',{apiVersion:1});
 new ResizeObserver(resize).observe(document.body);
 window.addEventListener('load',resize);
})();
</script></body></html>
