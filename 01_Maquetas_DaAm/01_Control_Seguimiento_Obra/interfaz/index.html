<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DaAm · Revisión de maqueta</title><style>body{margin:0;padding:16px;background:#edf2f8}button,select{cursor:pointer}</style><meta name="description" content="Maqueta de revisión DaAm: control y seguimiento de obra con cinco páginas y datos de demostración."><link rel="icon" href="favicon.svg"><style>
@media(max-width:750px){
body{padding:6px}
#daam-review{padding:8px}
#daam-review aside{padding:2px 6px 8px}
#daam-review .brand{font-size:24px;line-height:1.2}

#daam-review .panels{gap:0;margin-bottom:0}

#daam-review footer{margin-top:10px}

}
</style></head><body>
<div id="daam-review">
<style>
#daam-review{font-family:Arial,sans-serif;color:#17375e;background:#0c294e;border-radius:12px;padding:16px;display:grid;grid-template-columns:175px minmax(0,1fr);font-size:14px;line-height:1.5}#daam-review *{box-sizing:border-box}#daam-review aside{color:white;padding:8px 12px 8px 0}#daam-review .brand{font-size:28px;font-weight:700;margin-bottom:0}#daam-review .tag{color:#a7bdd5;font-size:12px;margin-bottom:25px}#daam-review nav{display:grid;gap:8px}#daam-review button{font:inherit;border:0;text-align:left;background:transparent;color:inherit;padding:10px;border-radius:5px;min-height:44px}#daam-review button.active{background:#294b72;color:white}#daam-review main{background:#f4f7fb;border-radius:9px;overflow:hidden;min-width:0}#daam-review header{background:white;padding:15px 22px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#daam-review .badge{color:#ac5200}#daam-review .body{padding:22px}#daam-review h2{font-size:23px;margin:0 0 4px;font-weight:700}#daam-review h3{font-size:16px;margin:0 0 14px;font-weight:700}#daam-review .sub{color:#71839b;margin:0 0 18px}#daam-review .filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}#daam-review label{display:grid;gap:4px;font-size:12px;flex:1;min-width:130px}#daam-review select{font:inherit;background:white;border:1px solid #dfe7f1;color:#17375e;padding:9px;border-radius:7px;width:100%;min-height:44px}#daam-review .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}#daam-review .metric,#daam-review .panel{background:white;border:1px solid #dfe7f1;border-radius:8px;padding:15px}#daam-review .metric .label{font-size:11px;color:#71839b;font-weight:700;text-transform:uppercase}#daam-review .value{font-size:25px;font-weight:700;margin:3px 0}#daam-review .hint{font-size:11px;color:#71839b}#daam-review .orange{color:#ed7000}#daam-review .panels{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}#daam-review .panel{min-width:0;margin-bottom:14px}#daam-review .barrow{margin-bottom:18px}#daam-review .barlabel{display:flex;justify-content:space-between;font-size:12px;gap:10px;margin-bottom:5px}#daam-review .track{height:7px;background:#eef2f7;border-radius:8px;overflow:hidden}#daam-review .bar{height:100%;background:#ff7900;border-radius:8px}#daam-review .tablewrap{overflow:auto}#daam-review table{border-collapse:collapse;width:100%;font-size:12px}#daam-review th{text-align:left;color:#71839b;font-weight:700}#daam-review td,#daam-review th{padding:10px 6px;border-bottom:1px solid #e5ecf4;white-space:nowrap}#daam-review .alert{background:#fff2e5;padding:12px;border-radius:6px;font-size:12px;margin-bottom:14px}#daam-review footer{color:#71839b;font-size:11px;margin-top:18px}#daam-review .legend{font-size:11px;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}#daam-review .legend span:before{content:' ';display:inline-block;width:18px;height:3px;background:#ff7900;margin-right:6px;vertical-align:middle}#daam-review .legend span:last-child:before{background:#294b72}#daam-review .chart{width:100%;height:200px;display:block}#daam-review .chart text{font-family:Arial;font-size:11px;fill:#71839b}#daam-review .timeline{display:grid;gap:15px}#daam-review .timeline .track{height:18px}#daam-review .timeline .bar{background:#294b72}#daam-review .footnote{font-size:12px;color:#71839b;margin-top:10px}@media(max-width:750px){#daam-review{grid-template-columns:1fr;padding:10px}#daam-review aside{padding:4px 8px 14px}#daam-review .tag{margin-bottom:10px}#daam-review nav{display:flex;flex-wrap:wrap;gap:4px}#daam-review nav button{font-size:12px}#daam-review .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}#daam-review .panels{grid-template-columns:1fr}#daam-review .body{padding:15px}#daam-review .value{font-size:22px}}
</style>
<aside><div class="brand">DaAm</div><div class="tag">Gestión de obras</div><nav aria-label="Páginas principales"><button class="active cursor-interaction" data-page="0" aria-pressed="true">Resumen de obra</button><button class="cursor-interaction" data-page="1" aria-pressed="false">Avance físico</button><button class="cursor-interaction" data-page="2" aria-pressed="false">Plazos y programa</button><button class="cursor-interaction" data-page="3" aria-pressed="false">Costos y presupuesto</button><button class="cursor-interaction" data-page="4" aria-pressed="false">Informes y tendencias</button></nav></aside>
<main><header><span>PROYECTOS / CONTROL Y SEGUIMIENTO</span><span class="badge">Datos de demostración</span></header><div class="body"><h2 id="dr-title">Resumen de obra</h2><p class="sub">Control y seguimiento de obra · Vista para revisión</p><div class="filters"><label>Obra<select id="dr-project"><option>Edificio demostrativo</option><option>Centro logístico demostrativo</option></select></label><label>Sector<select id="dr-sector"><option>Todos</option><option>Sector A</option><option>Sector B</option><option>Sector C</option></select></label><label>Período<select id="dr-week"><option value="8">Semana 08</option><option value="10">Semana 10</option><option value="12" selected>Semana 12</option><option value="14">Semana 14</option><option value="16">Semana 16</option></select></label></div><div id="dr-content" aria-live="polite"></div><footer>DaAm · Ingeniería y Asesorías | www.daam.cl · Información ficticia</footer></div></main>
<script>
(()=>{const root=document.getElementById('daam-review'),out=root.querySelector('#dr-content'),names=['Resumen de obra','Avance físico','Plazos y programa','Costos y presupuesto','Informes y tendencias'];let page=0;
const f=n=>n.toLocaleString('es-CL',{maximumFractionDigits:1}),metric=(l,v,h,orange=false)=>`<div class="metric"><div class="label">${l}</div><div class="value ${orange?'orange':''}">${v}</div><div class="hint">${h}</div></div>`,panel=(title,body)=>`<section class="panel"><h3>${title}</h3>${body}</section>`,table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function render(){const w=+root.querySelector('#dr-week').value,sec=root.querySelector('#dr-sector').value,proj=root.querySelector('#dr-project').selectedIndex,fac=proj?1.35:1,ss=sec==='Todos'?[0,1,2]:['Sector A','Sector B','Sector C'].indexOf(sec)>=0?[['Sector A','Sector B','Sector C'].indexOf(sec)]:[0];const specs=[['Fundaciones','m³',420,180,1,5],['Estructura','m³',900,440,3,12],['Instalaciones','m',1800,160,6,15],['Terminaciones','m²',2600,220,8,16]];
function data(t){return ss.flatMap(j=>specs.map((s,i)=>{const p=Math.max(0,Math.min(1,(t-s[4]-j+1)/(s[5]-s[4]+1))),r=Math.max(0,Math.min(1,(t-s[4]-j+1-(.5+j*.35+i*.2))/(s[5]-s[4]+1)));return {name:s[0],unit:s[1],qty:s[2]*fac,budget:s[3]*fac,p,r,cost:s[3]*fac*r*(1.02+i*.025),committed:s[3]*fac*Math.min(1,r+.16),eac:s[3]*fac*(1.02+i*.025),begin:s[4]+j,end:s[5]+j,sector:'Sector '+String.fromCharCode(65+j),delay:t<s[4]+j||r===1?0:Math.round((p-r)*(s[5]-s[4]+1)*7)}}))}const rows=data(w),sum=(k)=>rows.reduce((a,x)=>a+x[k],0),budget=sum('budget'),weighted=(r,k)=>r.reduce((a,x)=>a+x[k]*x.budget,0)/r.reduce((a,x)=>a+x.budget,0)*100,real=weighted(rows,'r'),plan=weighted(rows,'p'),cost=sum('cost'),eac=sum('eac');
function curve(costMode=false){let ticks='',grid='',lines='';[0,25,50,75,100].forEach(v=>{let y=165-v*1.35;grid+=`<line x1="42" x2="470" y1="${y}" y2="${y}" stroke="#e5ecf4"/><text x="35" y="${y+4}" text-anchor="end">${costMode?f(v/100*eac):v+'%'}</text>`});for(let t=1;t<=w;t++){if(t===1||t===w||t%3===0)ticks+=`<text x="${42+(t-1)*428/(w-1)}" y="187" text-anchor="middle">S${t}</text>`}for(const k of ['p','r']){const pts=Array.from({length:w},(_,i)=>{const d=data(i+1);const value=costMode?(k==='p'?d.reduce((a,x)=>a+x.p*x.budget,0):d.reduce((a,x)=>a+x.cost,0))/eac*100:weighted(d,k);return `${42+i*428/(w-1)},${165-value*1.35}`}).join(' ');lines+=`<polyline fill="none" stroke="${k==='p'?'#ff7900':'#294b72'}" stroke-width="2.5" points="${pts}"/>`}return `<div class="legend"><span>${costMode?'Valor planificado':'Planificado'}</span><span>${costMode?'Costo real':'Real'}</span></div><svg class="chart" viewBox="0 0 490 205" role="img" aria-label="Evolución ${costMode?'de costos en MM$':'del avance en porcentaje'} hasta semana ${w}">${grid}${ticks}${lines}</svg>`}
const phys=()=>table(['Partida','Sector','Plan / ejecutado','Avance','Estado'],rows.map(x=>[x.name,x.sector,`${f(x.qty*x.p)} / ${f(x.qty*x.r)} ${x.unit}`,f(x.r*100)+' %',x.r===1?'Terminada':x.r===0?'Pendiente':'En ejecución']));
const bars=specs.map(s=>{const d=rows.filter(x=>x.name===s[0]),v=weighted(d,'r');return `<div class="barrow"><div class="barlabel"><span>${s[0]}</span><strong>${f(v)} %</strong></div><div class="track"><div class="bar" style="width:${v}%"></div></div></div>`}).join('');
const top=`<div class="metrics">${metric('Avance real',f(real)+' %','Planificado: '+f(plan)+' %')}${metric('Desviación',f(real-plan)+' pp','Respecto de la línea base',true)}${metric('Costo real',f(cost)+' MM$','Acumulado al corte')}${metric('Partidas activas',rows.filter(x=>x.r>0&&x.r<1).length,'En ejecución')}</div>`;
const dt=n=>{const d=new Date(Date.UTC(2026,6,13+n));return d.toLocaleDateString('es-CL',{timeZone:'UTC'})};
root.querySelector('#dr-title').textContent=names[page];
if(page===0)out.innerHTML=top+`<div class="panels">${panel('Avance acumulado',curve())}${panel('Avance por especialidad',bars)}</div>`+`<div class="alert">${rows.filter(x=>x.delay>0).length} partidas con atraso · Sobrecosto final proyectado: ${f(eac-budget)} MM$</div>`+panel('Seguimiento de partidas',phys());
if(page===1)out.innerHTML=top+panel('Avance por especialidad',bars)+panel('Cantidades por partida y sector',phys())+'<div class="footnote">Avance global ponderado por presupuesto. Las cantidades se comparan por partida y unidad.</div>';
if(page===2)out.innerHTML=panel('Programa de línea base · Semanas 1 a 18',`<div class="timeline">${rows.map(x=>`<div><div class="barlabel"><span>${x.name} · ${x.sector}</span><span>S${x.begin}–S${x.end}</span></div><div class="track"><div class="bar" style="margin-left:${(x.begin-1)/18*100}%;width:${(x.end-x.begin+1)/18*100}%"></div></div></div>`).join('')}</div>`)+panel('Fechas y desviaciones',table(['Partida','Sector','Término plan','Proyección','Atraso'],rows.map(x=>[x.name,x.sector,dt(x.end*7-1),dt(x.end*7-1+x.delay),x.delay+' días'])))+'<div class="footnote">Proyección ilustrativa según brecha de avance; no representa un cálculo de ruta crítica.</div>';
if(page===3)out.innerHTML=`<div class="metrics">${metric('Presupuesto',f(budget)+' MM$','Aprobado')}${metric('Comprometido',f(sum('committed'))+' MM$','Incluye el costo ejecutado')}${metric('Costo real',f(cost)+' MM$','Acumulado')}${metric('Proyección final',f(eac)+' MM$','Estimación de demostración')}</div>`+panel('Evolución de costos · MM$',curve(true))+panel('Control por partida · MM$',table(['Partida','Sector','Presupuesto','Real','Desviación¹'],rows.map(x=>[x.name,x.sector,f(x.budget),f(x.cost),f(x.cost-x.r*x.budget)])))+'<div class="footnote">¹ Costo real menos valor presupuestado del trabajo ejecutado.</div>';
if(page===4)out.innerHTML=`<div class="panels">${panel('Tendencia de avance',curve())}${panel('Tendencia de costos · MM$',curve(true))}</div>`+panel('Informe semanal',table(['Semana','Planificado','Real','Brecha','Costo real (MM$)'],Array.from({length:w},(_,i)=>{const d=data(i+1),p=weighted(d,'p'),r=weighted(d,'r');return ['S'+(i+1),f(p)+' %',f(r)+' %',f(r-p)+' pp',f(d.reduce((a,x)=>a+x.cost,0))]})))+`<div class="alert">${rows.filter(x=>x.delay>0).length} partidas con atraso al corte · Sector: ${sec}</div>`;
}
root.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{page=+b.dataset.page;root.querySelectorAll('nav button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()}));root.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));render();})();
</script>
</div>

<script>
(function(){
 function send(type,extra){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},extra||{}),'*');}
 function resize(){send('streamlit:setFrameHeight',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)});}
 window.addEventListener('message',function(e){if(e.source===window.parent&&e.data.type==='streamlit:render'){resize();}});
 send('streamlit:componentReady',{apiVersion:1});
 new ResizeObserver(resize).observe(document.body);
 window.addEventListener('load',resize);
})();
</script></body></html>
